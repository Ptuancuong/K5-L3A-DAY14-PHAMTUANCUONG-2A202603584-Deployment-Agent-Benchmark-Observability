[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway cấp biến PORT; CMD trong Dockerfile đã lắng nghe theo ${PORT}.
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Secret (AGENT_API_KEY) và REDIS_URL đặt trên dashboard Railway / `railway variables`, không ghi ở đây.
